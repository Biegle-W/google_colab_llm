name: notebooks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  no-outputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Notebooks carry no outputs (they can hold API keys)
        run: python tools/check_notebooks.py
      - name: Unit tests
        run: python -m unittest notebook_code.tests.test_units
